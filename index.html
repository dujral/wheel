<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Strategy Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #f8fafc;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 0.75rem;
    }

    .field {
      margin-bottom: 1rem;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 0.35rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.95rem;
      pointer-events: none;
    }

    .input-wrapper .suffix {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.85rem;
      pointer-events: none;
    }

    input {
      width: 100%;
      padding: 0.65rem 0.75rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #3b82f6;
    }

    input.has-prefix {
      padding-left: 1.75rem;
    }

    input.has-suffix {
      padding-right: 3rem;
    }

    .divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 1.25rem 0;
    }

    .result {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }

    .result-label {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .result-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #4ade80;
    }

    .formula {
      font-size: 0.7rem;
      color: #475569;
      text-align: center;
      margin-top: 0.25rem;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wheel Strategy Calculator</h1>

    <div class="section-label">Inputs</div>

    <div class="field">
      <label for="premium">Option Premium</label>
      <div class="input-wrapper">
        <span class="prefix">$</span>
        <input type="number" id="premium" class="has-prefix" value="0" step="0.01" min="0">
      </div>
    </div>

    <div class="field">
      <label for="capital">Capital Required</label>
      <div class="input-wrapper">
        <span class="prefix">$</span>
        <input type="number" id="capital" class="has-prefix" value="0" step="0.01" min="0">
      </div>
    </div>

    <div class="field">
      <label for="days">Days to Expiry</label>
      <div class="input-wrapper">
        <input type="number" id="days" class="has-suffix" value="0" step="1" min="0">
        <span class="suffix">days</span>
      </div>
    </div>

    <hr class="divider">

    <div class="section-label">Calculations</div>

    <div class="result">
      <span class="result-label">Return for the Period</span>
      <span class="result-value" id="returnPeriod">0.92%</span>
    </div>
    <div class="formula" id="returnFormula">$52.00 / $5,648.00</div>

    <div class="result">
      <span class="result-label">Annualized Return</span>
      <span class="result-value" id="annualReturn">112.02%</span>
    </div>
    <div class="formula" id="annualFormula">($52.00 / $5,648.00) × (365 / 3)</div>
  </div>

  <script>
    const premiumInput = document.getElementById('premium');
    const capitalInput = document.getElementById('capital');
    const daysInput = document.getElementById('days');
    const returnPeriodEl = document.getElementById('returnPeriod');
    const annualReturnEl = document.getElementById('annualReturn');
    const returnFormulaEl = document.getElementById('returnFormula');
    const annualFormulaEl = document.getElementById('annualFormula');

    function formatCurrency(n) {
      return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calculate() {
      const premium = parseFloat(premiumInput.value) || 0;
      const capital = parseFloat(capitalInput.value) || 0;
      const days = parseInt(daysInput.value) || 1;

      const returnForPeriod = capital > 0 ? premium / capital : 0;
      const annualized = capital > 0 ? (premium / capital) * (365 / days) : 0;

      returnPeriodEl.textContent = (returnForPeriod * 100).toFixed(2) + '%';
      annualReturnEl.textContent = (annualized * 100).toFixed(2) + '%';

      returnFormulaEl.textContent = formatCurrency(premium) + ' / ' + formatCurrency(capital);
      annualFormulaEl.textContent =
        '(' + formatCurrency(premium) + ' / ' + formatCurrency(capital) + ') × (365 / ' + days + ')';

      // Color: green if positive, red if negative, neutral if zero
      returnPeriodEl.style.color = returnForPeriod > 0 ? '#4ade80' : returnForPeriod < 0 ? '#f87171' : '#94a3b8';
      annualReturnEl.style.color = annualized > 0 ? '#4ade80' : annualized < 0 ? '#f87171' : '#94a3b8';
    }

    premiumInput.addEventListener('input', calculate);
    capitalInput.addEventListener('input', calculate);
    daysInput.addEventListener('input', calculate);

    calculate();
  </script>
</body>
</html>
